name: Precios y fotos de eBay
on:
  schedule:
    - cron: '17 2 * * *'      # cada noche (hora UTC)
  workflow_dispatch:
    inputs:
      calls: { description: 'Búsquedas como mucho', default: '4500' }
      only: { description: 'Solo estas colecciones (ids separados por comas)', default: '' }
permissions:
  contents: write
concurrency: { group: ebay, cancel-in-progress: false }
jobs:
  ebay:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Buscar en eBay
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          CALLS: ${{ github.event.inputs.calls || '4500' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: python3 tools/ebay.py
      - name: Guardar
        run: |
          git config user.name "AREA151 bot"; git config user.email "actions@users.noreply.github.com"
          git add ebay
          git diff --cached --quiet || git commit -qm "eBay: precios y fotos $(date -u +%F)"
          git push
